name: Android
on:
  workflow_dispatch:
  # Gated on CI rather than on `push`. Both workflows used to fire on the same
  # master push, in parallel, so a commit that broke the test suite still built
  # an APK and pushed it to the testers group — a broken master reached real
  # devices before anyone saw the red X.
  #
  # `workflow_run` was chosen over folding these jobs into ci.yml with `needs:`
  # because the two have genuinely different shapes: ci.yml also runs on every
  # pull request, where a 3-ABI Rust cross-compile plus an APK build would be
  # pure waste, and this workflow keeps a manual `workflow_dispatch` entry point
  # that a `needs:` dependency would drag the whole test matrix into.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  # Keyed on the COMMIT, not the ref: under `workflow_run` every event reports
  # `github.ref` as the default branch, so a plain ref key would let a newer
  # master commit cancel an in-flight distribution of an older one mid-upload.
  # Keyed this way, cancellation only ever supersedes a re-run of the same
  # commit — which is exactly the redundant work worth killing.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build APK + distribute
    runs-on: ubuntu-latest
    # Cold path: NDK download, three Rust Android targets built from scratch,
    # then a release APK. Deliberately well clear of the observed ~25 min worst
    # case so a cache miss is not mistaken for a hang.
    timeout-minutes: 60
    # A manual dispatch builds whatever is at HEAD; a CI-triggered run builds
    # only if CI actually passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # `workflow_run` checks out the DEFAULT BRANCH by default, not the
          # commit that triggered CI. Without this the job could build a
          # different tree than the one CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Two ABIs, not three. `x86_64-linux-android` is an EMULATOR target: no
      # phone or tablet in the testers group runs it, and every build paid for a
      # third full Rust cross-compile plus a third copy of the engine .so inside
      # a universal APK. Re-add it (here and in the cargo-ndk step below) if the
      # app ever has to run on an x86_64 emulator or a Chromebook.
      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine_shim

      # cargo-ndk drives the NDK toolchain for cross-compiling the cdylib.
      # Cached across runs via ~/.cargo/bin (restored by rust-cache above is
      # crate-scoped, so we guard the install with a `which` check).
      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # NDK 28.2.13676358 is pinned LITERALLY in app/android/app/build.gradle.kts
      # (`ndkVersion = "28.2.13676358"`, no longer `flutter.ndkVersion`), and this
      # step is the other half of that pin: the two must be edited together, or
      # cargo-ndk cross-compiles the engine against one NDK while Gradle packages
      # it for another. The ubuntu-latest image ships several NDKs under
      # $ANDROID_SDK_ROOT/ndk, but not necessarily this exact revision, and both
      # cargo-ndk (engine .so) and Flutter's gradle build must agree on the NDK.
      # Simplest reliable path: install the exact version via sdkmanager and
      # point ANDROID_NDK_HOME at it for the cargo-ndk step.
      - name: Install Android NDK 28.2.13676358
        # No `pipefail`: `yes |` receives SIGPIPE once sdkmanager stops reading
        # (licenses already accepted on the runner), which would otherwise fail
        # the pipeline even though sdkmanager itself succeeded.
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cross-compile engine shim -> jniLibs
        working-directory: native/engine_shim
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a \
            -o ../../app/android/app/src/main/jniLibs \
            build --release

      - name: List staged jniLibs
        run: find app/android/app/src/main/jniLibs -type f -name '*.so' -exec ls -l {} +

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # Release signing, gated on four repository secrets exactly the way the
      # Firebase and iOS-signing paths are gated. Present -> decode the upload
      # keystore and write the key.properties that app/android/app/build.gradle.kts
      # reads. Absent -> say so loudly and let Gradle's documented debug-key
      # fallback keep the job green. See app/android/KEYSTORE_SETUP.md.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/aigammon-upload.jks
            # A .properties file treats backslash as an escape, so escape it.
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
            {
              echo "storeFile=aigammon-upload.jks"
              echo "storePassword=$(esc "$ANDROID_KEYSTORE_PASSWORD")"
              echo "keyAlias=$(esc "$ANDROID_KEY_ALIAS")"
              echo "keyPassword=$(esc "$ANDROID_KEY_PASSWORD")"
            } > app/android/key.properties
            echo "Release signing ENABLED (upload keystore installed)"
          else
            echo "::warning::Android signing secrets not set — the release APK will be signed with the DEBUG keystore and cannot be published. See app/android/KEYSTORE_SETUP.md"
          fi

      # Android telemetry config file, generated — never committed.
      #
      # `google-services.json` is what the com.google.gms.google-services Gradle
      # plugin reads, and that plugin is the prerequisite for the Crashlytics
      # and Performance Gradle plugins (Crashlytics v3 resolves the app id from
      # the `google_app_id` string resource google-services generates; there is
      # no way to feed it a --dart-define). Those plugins are what buy NDK crash
      # capture for the Rust engine `.so` and automatic network/screen traces.
      #
      # Its contents are NOT secret — project id, project number, app id and the
      # Web API key all ship inside every APK already, and three of the four are
      # repo *Variables* rather than secrets for exactly that reason. It is
      # generated rather than committed for the same reason `key.properties` is:
      # a fork that inherited a real file would silently report ITS crashes into
      # THIS project. See app/android/app/build.gradle.kts and firebase/DEPLOY.md.
      #
      # Gated all-or-nothing on the same four values as the telemetry defines
      # below. Absent -> no file -> app/build.gradle.kts skips all three Firebase
      # Gradle plugins and the build stays green with Dart-only reporting.
      - name: Configure Firebase Android config
        env:
          FB_PROJECT: ${{ vars.AIGAMMON_FIREBASE_PROJECT }}
          FB_API_KEY: ${{ vars.AIGAMMON_FIREBASE_API_KEY }}
          FB_SENDER_ID: ${{ vars.AIGAMMON_FIREBASE_SENDER_ID }}
          FB_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -eu
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ] \
             && [ -n "$FB_SENDER_ID" ] && [ -n "$FB_ANDROID_APP_ID" ]; then
            # jq rather than a heredoc: every one of these values is
            # externally supplied, and jq is the only thing here that cannot be
            # talked into emitting invalid JSON. --arg also keeps the numeric
            # project_number a STRING, which is what the schema wants.
            #
            # package_name MUST equal `applicationId` in
            # app/android/app/build.gradle.kts — the plugin fails the build with
            # "No matching client found for package name" when it does not.
            jq -n \
              --arg project_number "$FB_SENDER_ID" \
              --arg project_id "$FB_PROJECT" \
              --arg app_id "$FB_ANDROID_APP_ID" \
              --arg package_name "com.xmelon.aigammon_app" \
              --arg api_key "$FB_API_KEY" \
              '{
                 project_info: {
                   project_number: $project_number,
                   project_id: $project_id
                 },
                 client: [{
                   client_info: {
                     mobilesdk_app_id: $app_id,
                     android_client_info: { package_name: $package_name }
                   },
                   oauth_client: [],
                   api_key: [{ current_key: $api_key }],
                   services: {
                     appinvite_service: { other_platform_oauth_client: [] }
                   }
                 }],
                 configuration_version: "1"
               }' > app/android/app/google-services.json
            echo "Firebase Android config WRITTEN — Crashlytics/Performance Gradle plugins will apply"
          else
            echo "::warning::Firebase telemetry config incomplete — no google-services.json; the Crashlytics/Performance Gradle plugins will NOT apply and Android native (NDK) crashes will go unreported. See firebase/DEPLOY.md."
          fi

      # Every CI build gets a unique, monotonically increasing build number
      # (the workflow run number), so testers can tell releases apart in
      # Firebase App Distribution. The semantic version comes from pubspec.
      # Online-play dart-defines are injected when the repo VARIABLES
      # AIGAMMON_FIREBASE_PROJECT and AIGAMMON_FIREBASE_API_KEY are set
      # (Settings -> Secrets and variables -> Actions -> Variables); when
      # unset the app builds with online play "not configured", exactly as
      # before. See firebase/DEPLOY.md.
      #
      # --obfuscate --split-debug-info strips Dart symbols out of the binary
      # and into build/symbols/android. Two consequences worth knowing:
      #   * a stack trace from a release build is now UNREADABLE until it is
      #     symbolicated (`flutter symbolize -d <symbols> -i trace.txt`), which
      #     is why the symbols directory is uploaded as its own artifact,
      #     keyed by run number so a trace can be matched to the exact build;
      #   * `runtimeType.toString()` no longer yields real class names. The
      #     only uses in this repo are diagnostic message interpolation
      #     (net_match_controller, match_transport, online_client) — degraded
      #     text, no behaviour change. Nothing here dispatches on it.
      #
      # --split-per-abi, not a universal APK and not an app bundle:
      #   * a universal APK carried every ABI's copy of the ~MB engine .so to
      #     every tester, and no device can use more than one of them;
      #   * an .aab is the smaller artifact on paper, but Firebase App
      #     Distribution can only accept one for an app that is LINKED TO GOOGLE
      #     PLAY — it needs Play App Signing to derive installable APKs from the
      #     bundle. This project has no Play listing and distributes straight to
      #     a testers group, so an .aab here would be rejected at upload.
      # That leaves two per-ABI APKs (arm64-v8a, armeabi-v7a). Flutter gives them
      # distinct version codes automatically (it prefixes the ABI index), which
      # is what keeps two uploads of the same build from colliding.
      - name: Build release APK
        working-directory: app
        env:
          FB_PROJECT: ${{ vars.AIGAMMON_FIREBASE_PROJECT }}
          FB_API_KEY: ${{ vars.AIGAMMON_FIREBASE_API_KEY }}
          FB_SENDER_ID: ${{ vars.AIGAMMON_FIREBASE_SENDER_ID }}
          # Reused from the App Distribution setup below — the SAME Android app
          # id identifies the app to distribute and to report telemetry for, so
          # there is deliberately no second secret for it.
          FB_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          DEFINES=""
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ]; then
            DEFINES="--dart-define=AIGAMMON_FIREBASE_PROJECT=$FB_PROJECT --dart-define=AIGAMMON_FIREBASE_API_KEY=$FB_API_KEY"
            echo "Online play ENABLED for project $FB_PROJECT"
          else
            echo "Online-play repo variables not set — building with online play not configured"
          fi
          # Analytics / Performance / Crashlytics. Independent of the online
          # gate above: telemetry needs the project + key AND the numeric sender
          # id AND the Android app id, and the app builds fine (silently, with
          # no telemetry) when any of them is missing. See firebase/DEPLOY.md.
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ] \
             && [ -n "$FB_SENDER_ID" ] && [ -n "$FB_ANDROID_APP_ID" ]; then
            DEFINES="$DEFINES --dart-define=AIGAMMON_FIREBASE_SENDER_ID=$FB_SENDER_ID --dart-define=AIGAMMON_FIREBASE_ANDROID_APP_ID=$FB_ANDROID_APP_ID"
            echo "Telemetry ENABLED (Analytics + Performance + Crashlytics)"
          else
            echo "Telemetry config incomplete — building with analytics/performance/crashlytics disabled"
          fi
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols/android \
            $DEFINES
          ls -l build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aigammon-apk
          # Both per-ABI APKs. A tester on a 32-bit device installs the
          # armeabi-v7a one by hand from here; the App Distribution step below
          # pushes the arm64-v8a build, which is what every device made in the
          # last several years actually runs.
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      # Keyed by run number: the build number in the APK is the same value, so
      # a trace from a tester's build maps to exactly one symbols artifact.
      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: aigammon-symbols-android-${{ github.run_number }}
          path: app/build/symbols/android
          if-no-files-found: error

      # Secrets can't be referenced in a step-level `if:`, so gate on an env var
      # exported from a prior shell step.
      - name: Check Firebase secrets
        id: fb
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute to Firebase App Distribution
        if: steps.fb.outputs.has_firebase == 'true'
        # Pinned to a commit SHA, not the `v1` tag: a mutable tag can be
        # repointed at any commit by the action's owner (or by anyone who
        # compromises that account), and this step is handed the Firebase
        # service-account key. `v1` resolved to this commit on 2026-07-31.
        # Re-pin deliberately when upgrading; do not switch back to a tag.
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          # arm64-v8a only. The action uploads ONE file, and App Distribution
          # does no ABI matching — it would show testers two indistinguishable
          # releases. arm64-v8a is the 64-bit ABI every device Google Play has
          # required since 2019 supports; the armeabi-v7a APK stays available as
          # the build artifact above for the rare 32-bit tester.
          file: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Skip Firebase distribution (secrets not set)
        if: steps.fb.outputs.has_firebase != 'true'
        run: |
          echo "Firebase secrets not set — skipping distribution (see .github/workflows/README.md: Firebase App Distribution setup)"
