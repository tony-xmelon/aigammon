name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege. Nothing here writes to the repo, comments on PRs, or
# publishes packages, so the default read/write token is more authority than any
# step needs — and a compromised third-party action inherits whatever the token
# has. Individual jobs can opt back up if that ever changes.
permissions:
  contents: read

# One live run per branch. A force-push or a rapid second push supersedes the
# first: the older run's result is about code nobody is looking at any more, and
# these six jobs are the bulk of the repo's CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: backgammon_core tests
    runs-on: ubuntu-latest
    # Pure-Dart unit suite; about a minute in practice. The ceiling only ever
    # fires on a hang (a stuck pub fetch, a test awaiting a future that never
    # lands) rather than on slow-but-working CI.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/backgammon_core
      - run: dart analyze --fatal-infos
        working-directory: packages/backgammon_core
      - run: dart test
        working-directory: packages/backgammon_core

  lan:
    name: lan_play tests
    runs-on: ubuntu-latest
    # Real sockets and timers - the likeliest suite to deadlock rather than fail.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/lan_play
      - run: dart analyze --fatal-infos
        working-directory: packages/lan_play
      - run: dart test
        working-directory: packages/lan_play

  match_transport:
    name: match_transport tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/match_transport
      - run: dart analyze --fatal-infos
        working-directory: packages/match_transport
      - run: dart test
        working-directory: packages/match_transport

  engine:
    name: engine build + integration tests (linux)
    runs-on: ubuntu-latest
    # A COLD Rust cache builds wildbg + the shim from scratch, then the real-net
    # integration suite runs. Generous on purpose: a cache miss must not read as
    # a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine_shim
      - name: Build engine shim (cdylib)
        run: cargo build --release
        working-directory: native/engine_shim
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/engine_bindings
      - run: dart analyze --fatal-infos
        working-directory: packages/engine_bindings
      - name: Unit tests
        run: dart test
        working-directory: packages/engine_bindings
      - name: Engine integration tests (real nets)
        run: dart test -P engine
        working-directory: packages/engine_bindings
        env:
          WILDBG_LIB_PATH: ${{ github.workspace }}/native/engine_shim/target/release/libaigammon_engine.so

  app:
    name: flutter app tests
    runs-on: ubuntu-latest
    # Flutter SDK download plus ~700 widget tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      # -x golden: golden PNGs are generated on the Windows dev machine and
      # differ by <0.1% antialiasing on Linux; they run locally instead.
      - run: flutter test -x golden
        working-directory: app

  online:
    name: online play (emulator)
    runs-on: ubuntu-latest
    # The heaviest leg: Node + Java + Flutter + Dart toolchains, then the whole
    # Firestore-emulator suite (rules + two-client E2E) behind emulators:exec.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Node is here for the Firebase CLI and for the rules suite's
      # @firebase/rules-unit-testing (firebase/rules-tests). The backend itself
      # is rules-only — Spark plan, no Cloud Functions — so nothing is built.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install -g firebase-tools
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # online_client is the largest package on the online side and was the one
      # package CI never analysed. It passes locally, so the step is free.
      - name: online_client analyze
        run: dart pub get && dart analyze --fatal-infos
        working-directory: packages/online_client
      - name: online_client unit tests
        run: dart test
        working-directory: packages/online_client
      - name: Emulator suites
        run: |
          firebase emulators:exec --project demo-aigammon --only firestore,auth \
            "bash ./ci-emulator-suites.sh"
        working-directory: firebase
