org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# mobile_scanner (the QR join scanner) ships Google's ML Kit barcode model
# BUNDLED into the APK by default. Unbundled, the model is instead fetched once
# by Google Play services the first time a scanner is opened, and the several
# megabytes of model data leave the download entirely.
#
# The trade: on a device whose Play services has never fetched the model, the
# FIRST scan needs a network round trip and the camera view shows nothing to
# decode until it lands. Every subsequent scan — and every scan on a device that
# already has the model for any other app — is identical to the bundled build.
# Scanning a QR code is an optional shortcut here (the code can always be typed
# in by hand on the Play Nearby screen), so a one-off first-run delay is a fair
# price for the size.
dev.steenbakker.mobile_scanner.useUnbundled=true
