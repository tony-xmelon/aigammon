name: aigammon_app
description: AI Gammon — backgammon with a neural-net engine.
publish_to: 'none'
version: 0.14.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  drift: ^2.18.0
  # The QR code the host shows. Pure Dart (its only dependency is `qr`, the
  # encoder) — it paints on a canvas and pulls in no platform channel, so it
  # costs the app nothing on the platforms that never scan.
  qr_flutter: ^4.1.0
  # The camera preview the guest scans with, and the barcode decoder behind it.
  # A plugin, so it does have native code on Android/iOS/macOS/web, but its
  # dependency list is small (collection, meta, plugin_platform_interface, web)
  # and it is the only thing here that decodes a QR code. It is NOT the app's
  # only camera any more — Buddy Mode uses `camera` below, for frames this
  # package does not expose — but both want CAMERA on Android and
  # NSCameraUsageDescription on iOS; see the manifest and Info.plist, and
  # test/android_manifest_test.dart plus test/ios_info_plist_test.dart.
  mobile_scanner: ^7.4.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  backgammon_core:
    path: ../packages/backgammon_core
  engine_bindings:
    path: ../packages/engine_bindings
  match_transport:
    path: ../packages/match_transport
  online_client:
    path: ../packages/online_client
  lan_play:
    path: ../packages/lan_play
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_performance: ^0.11.4+5
  firebase_crashlytics: ^5.2.6
  url_launcher: ^6.3.2
  # --- Buddy Mode (Plan 19) ---------------------------------------------------
  # The perception core: frames in, typed answers about a PHYSICAL board out.
  # Pure Dart on purpose — no camera, no plugin, no dart:ui — so it builds and
  # tests on this Windows dev machine against a committed corpus. The app owns
  # the camera and hands it `Frame`s; see lib/buddy/camera_frame_source.dart.
  board_vision:
    path: ../packages/board_vision
  # The camera Buddy Mode watches the board through. Distinct from
  # mobile_scanner above, which owns the QR path and exposes no frame stream:
  # this is the only plugin that surrenders raw YUV420 planes
  # (`startImageStream`), which is precisely what board_vision needs. The two
  # never run at once — QR join and a Buddy match are different screens — but
  # they do share the CAMERA permission and the iOS usage string.
  camera: ^0.12.0+2
  # Buddy's voice. Wraps the platform TTS engine on each OS, so it adds no
  # model or asset weight; lib/buddy/speaker.dart still guards it to Android/iOS
  # the way lib/analytics/firebase_observability.dart guards FlutterFire,
  # because Buddy Mode as a whole is mobile-only.
  #
  # WINDOWS BUILD PREREQUISITE: this package ships a Windows plugin whose
  # CMakeLists calls `find_program(nuget)` and FATAL_ERRORs without it — so
  # `flutter run -d windows` fails with "nuget.exe not found" on a machine that
  # has no NuGet CLI, even though nothing on Windows ever calls the plugin.
  # `winget install Microsoft.NuGet` fixes it; see the toolchain section of
  # README.md. There is no supported way to exclude a plugin from one platform's
  # build, so the prerequisite is the fix.
  flutter_tts: ^4.2.5
  # The gyroscope half of the stable-frame gate. Perception may only read a
  # frame the phone was HOLDING STILL for; the accelerometer/gyro stream is the
  # cheap half of that test (the other half is an inter-frame pixel diff, which
  # costs nothing extra). Tiny plugin, event channels only, and its answer is
  # injected into board_vision as a single bool — see `MotionHint`.
  sensors_plus: ^7.1.0
  # The microphone Buddy listens for a throw with — an ATTENTION HINT and
  # nothing else. The mode works identically with it absent, refused or turned
  # off; all it ever does is tell the frame gate to look sooner (see
  # lib/buddy/dice_sound_trigger.dart and `FrameGate.attend`).
  #
  # Chosen over the alternatives because it is the smallest thing that can hand
  # over LIVE audio: `startStream` yields raw PCM in memory, so nothing is ever
  # written to disk and each chunk is reduced to one number and dropped. (The
  # packages that record to a file would have Buddy keeping a recording of the
  # room for the length of a match, which is not a trade this feature is worth.)
  # It is also the only maintained recorder whose amplitude path needs no
  # platform-specific units: we compute RMS from the samples ourselves, so the
  # detector's thresholds mean the same thing on both OSes.
  #
  # Guarded to Android/iOS the way flutter_tts is, because Buddy Mode is
  # mobile-only; RECORD_AUDIO and NSMicrophoneUsageDescription were declared in
  # Task 10 and are asserted by test/android_manifest_test.dart and
  # test/ios_info_plist_test.dart.
  #
  # NO WINDOWS BUILD PREREQUISITE, unlike flutter_tts above: `record_windows`
  # builds against the Windows SDK's own Media Foundation headers and calls no
  # `find_program`, so `flutter run -d windows` needs nothing installed for it.
  # Verified by reading the plugin's CMakeLists rather than assumed — see the
  # toolchain section of README.md, which now says so alongside the nuget note.
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  sqlite3: ^2.4.6
  flutter_launcher_icons: ^0.14.1
  # Test-only, and only for `CameraImageData` / `CameraImagePlane` /
  # `CameraImageFormat`: `package:camera` re-exports a `show` list that leaves
  # those three out, so the ONLY way to hand a synthetic `CameraImage` to
  # `YuvFrame.fromCameraImage` is to build one from the platform interface
  # directly. That conversion — the luma row stride, and iOS's two-plane NV12
  # layout — is the most bug-prone code in lib/buddy/camera_frame_source.dart
  # and the least likely to be caught on a device, so it is worth the entry.
  camera_platform_interface: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/nets/

# Launcher icons. The source PNGs are generated from the app's own brand mark
# (lib/branding/app_mark.dart) — see tool/generate_app_icon.dart. Regenerate the
# platform icons after changing the artwork:
#
#   flutter test tool/generate_app_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  # Android adaptive icon: felt-tan plate from the launcher, motif on top.
  adaptive_icon_background: "#B8814D"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive.png
  ios: true
  # iOS rejects an alpha channel; the source is already opaque, but flatten
  # defensively so a future edit cannot ship a rejected build.
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
