name: aigammon_app
description: AIGammon â€” backgammon with a neural-net engine.
publish_to: 'none'
version: 0.8.0+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  backgammon_core:
    path: ../packages/backgammon_core
  engine_bindings:
    path: ../packages/engine_bindings
  online_client:
    path: ../packages/online_client
  lan_play:
    path: ../packages/lan_play

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  sqlite3: ^2.4.6
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/nets/

# Launcher icons. The source PNGs are generated from the app's own brand mark
# (lib/branding/app_mark.dart) — see tool/generate_app_icon.dart. Regenerate the
# platform icons after changing the artwork:
#
#   flutter test tool/generate_app_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  # Android adaptive icon: felt-tan plate from the launcher, motif on top.
  adaptive_icon_background: "#B8814D"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive.png
  ios: true
  # iOS rejects an alpha channel; the source is already opaque, but flatten
  # defensively so a future edit cannot ship a rejected build.
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
