name: engine_bindings
description: dart:ffi bindings and isolate service for the wildbg engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  backgammon_core:
    path: ../backgammon_core
  ffi: ^2.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
  # Dev-only: used by tool/generate_met.dart and the MET drift-guard test to
  # parse the vendored gnubg XML. The generated lib/src/met.dart has no runtime
  # dependency on this package.
  xml: ^6.5.0
