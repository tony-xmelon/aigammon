name: match_transport
description: >-
  Pure-Dart MatchTransport interface, shared wire frames, commit-reveal fair
  dice and an in-memory transport for AIGammon's unified LAN + online play.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  backgammon_core:
    path: ../backgammon_core
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  # A dev dependency even though lib/transport_contract.dart imports it: that
  # library is a test-only sibling entrypoint, never reachable from
  # lib/match_transport.dart or lib/testing.dart, and every package that
  # imports it has `test` of its own.
  test: ^1.25.0
