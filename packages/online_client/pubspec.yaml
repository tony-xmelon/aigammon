name: online_client
description: >-
  Pure-Dart Firestore/Auth REST + gRPC-Listen transport and MatchApi facade for
  AIGammon online play. No Cloud Functions: the backend is firestore.rules.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  backgammon_core:
    path: ../backgammon_core
  grpc: ^5.1.0
  http: ^1.2.0
  match_transport:
    path: ../match_transport

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
